; Window size patch settings
; Place this file next to Rance7.exe together with the proxy dinput.dll.
[Display]
; Output (window client) size. Game content is 800x600 (4:3).
; Can also be changed at runtime from the Settings menu's window size
; item; the choice is written back here and restored on next launch.
; 800x600 = original size (scaling off).
Width=1280
Height=960
; 0 = nearest neighbor (sharp pixels), 1 = smooth (halftone bilinear)
Filter=1
; 0 = stretch to fill, 1 = keep 4:3 aspect (black bars, fractional
;     scale), 2 = largest integer scale (no subpixel jitter)
ScaleMode=1
; 1 = borderless fullscreen covering the monitor at startup,
;     0 = windowed. Toggle at runtime via the System menu item
;     "borderless fullscreen" or Alt+B. (Menu "fullscreen" / Alt+Enter
;     remains the game's native exclusive fullscreen.)
Fullscreen=0

[Debug]
; 1 = write diagnostics to windowsize_log.txt next to the game exe
Log=0
